# Unraid stack, for the Docker Compose Manager plugin.
#
# Differences from docker-compose.prod.yml:
#   - no Caddy, so nothing competes with the Unraid webGUI for ports 80/443
#     and there is no Caddyfile to place next to this one
#   - web is published on a port instead, for LAN access or for an existing
#     reverse proxy (SWAG, Nginx Proxy Manager, Traefik) to sit in front of
#   - database lives on a pool path by default, never /mnt/user
#
# Paste this into: Compose → your stack → Edit Stack → Compose File
# Paste the env into: Compose → your stack → Edit Stack → .env File
#
# IMPORTANT: clear the editor first (Ctrl+A, Delete). The plugin pre-fills a
# template that already declares `services:`, and pasting underneath it gives
#   yaml: unmarshal errors: mapping key "services" already defined at line 1
# This file must be the entire contents, starting at the line below.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: tracker
    volumes:
      # Prefer the direct pool path (/mnt/cache/appdata/...) over /mnt/user/,
      # which goes through shfs, Unraid's FUSE overlay. Postgres wants real
      # POSIX locking and fsync, and shfs is slower besides.
      #
      # When the appdata share is cache-only these are the SAME directory on
      # disk, just reached without the FUSE layer — so you keep the standard
      # appdata layout and lose nothing. See the README.
      - ${PGDATA_VOLUME:-/mnt/user/appdata/price-tracker/pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Applies pending migrations then exits. Runs on every Compose Up, and is a
  # no-op when nothing is pending, so a version bump needs no manual step.
  migrate:
    image: ${APP_IMAGE:-arcralius/price-tracker:0.4.0}
    restart: "no"
    # Retry rather than dying on the first attempt: a healthcheck-passing
    # Postgres can still refuse connections for a moment (it restarts once
    # during first-time initialisation), which shows up as
    # "P1001: Can't reach database server at db:5432".
    command: >
      sh -c 'for i in $$(seq 1 30); do
        npx prisma migrate deploy && exit 0;
        echo "database not reachable yet — retry $$i/30";
        sleep 3;
      done;
      echo "giving up after 90s"; exit 1'
    environment:
      DATABASE_URL: postgresql://tracker:${POSTGRES_PASSWORD}@db:5432/tracker?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  web:
    image: ${APP_IMAGE:-arcralius/price-tracker:0.4.0}
    restart: unless-stopped
    command: node server.js
    ports:
      # Host port : container port. Only the host side can clash with your
      # other containers; the container side stays 3000 regardless.
      - "${WEB_PORT:-8383}:3000"
    environment:
      DATABASE_URL: postgresql://tracker:${POSTGRES_PASSWORD}@db:5432/tracker?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in the .env file}
      # Plain http on the LAN needs this false, or the browser discards the
      # session cookie and login silently bounces back to the login page.
      # Set it to true once HTTPS is in front.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SIGNUP_MODE: ${SIGNUP_MODE:-open}
      SIGNUP_CODE: ${SIGNUP_CODE:-}
      MAX_ITEMS_PER_USER: ${MAX_ITEMS_PER_USER:-100}
      CHECK_CRON: ${CHECK_CRON:-0 9 * * *}
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      TZ: ${TZ:-Asia/Singapore}
      BROWSER_WS_ENDPOINT: ${BROWSER_WS_ENDPOINT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [internal, browsernet]

  # Does the daily scraping and sends the Telegram alerts. Without it nothing
  # is ever re-checked.
  worker:
    image: ${APP_IMAGE:-arcralius/price-tracker:0.4.0}
    restart: unless-stopped
    command: npx tsx worker/index.ts
    environment:
      DATABASE_URL: postgresql://tracker:${POSTGRES_PASSWORD}@db:5432/tracker?schema=public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CHECK_CRON: ${CHECK_CRON:-0 9 * * *}
      CHECK_ON_BOOT: ${CHECK_ON_BOOT:-false}
      NODE_ENV: production
      TZ: ${TZ:-Asia/Singapore}
      BROWSER_WS_ENDPOINT: ${BROWSER_WS_ENDPOINT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, browsernet]

  # OPTIONAL. Renders pages in a real Chromium for sites that build their price
  # in JavaScript (IKEA, most airline fare pages). Off unless you set
  # COMPOSE_PROFILES=browser in the .env file — the image is ~2GB.
  #
  # Deliberately on its own network with no route to `db`: it loads arbitrary
  # third-party pages, so it should not be able to reach the database.
  browser:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    profiles: ["browser"]
    restart: unless-stopped
    init: true
    user: pwuser
    working_dir: /home/pwuser
    command: npx -y playwright@1.62.1 run-server --port 3000 --host 0.0.0.0
    networks: [browsernet]

networks:
  internal:
  browsernet:
