services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "npx prisma migrate deploy && node server.js"
    environment:
      DATABASE_URL: postgresql://tracker:tracker@db:5432/tracker?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-secret-change-me}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      HOSTNAME: "0.0.0.0"
      TZ: ${TZ:-Asia/Singapore}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: npx tsx worker/index.ts
    environment:
      DATABASE_URL: postgresql://tracker:tracker@db:5432/tracker?schema=public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CHECK_CRON: ${CHECK_CRON:-0 9 * * *}
      CHECK_ON_BOOT: ${CHECK_ON_BOOT:-false}
      TZ: ${TZ:-Asia/Singapore}
    depends_on:
      web:
        condition: service_started

volumes:
  pgdata:
